name: Rastrillo de noticias

on:
  schedule:
    - cron: "23 * * * *"   # cada hora
  push:
    branches: [main]
    paths: ["data/rellenar_semana"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  rastrillo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar notas
        run: python3 scripts/rastrillo.py
      - name: Guardar
        run: |
          git config user.name "rastrillo-bot"
          git config user.email "rastrillo-bot@users.noreply.github.com"
          git add -A data/crudo.json data/videos.json data/tuits.json data/rellenar_semana 2>/dev/null || git add data/crudo.json data/videos.json data/tuits.json
          git diff --cached --quiet && exit 0
          git commit -m "Rastrillo: notas nuevas"
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push && break; sleep 5; done
