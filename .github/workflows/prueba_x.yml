name: Prueba X

on:
  push:
    branches: [main]
    paths: ["scripts/prueba_x.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/prueba_x.py
      - run: |
          git config user.name "prueba-bot"
          git config user.email "prueba-bot@users.noreply.github.com"
          git add data/prueba_x.json
          git diff --cached --quiet && exit 0
          git commit -m "Prueba X"
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push && break; sleep 5; done
